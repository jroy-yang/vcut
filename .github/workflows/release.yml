name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needed to create GitHub Release

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary target — full bundled binary, zero deps
          - os: windows-latest
            asset: ffmpeg-master-latest-win64-gpl-shared.zip
            archive_ext: zip
            artifact: vcut-windows-x86_64
            binary_name: vcut.exe
          # Linux — full bundle with shared ffmpeg libs (lib*.so alongside)
          - os: ubuntu-latest
            asset: ffmpeg-master-latest-linux64-gpl-shared.tar.xz
            archive_ext: tar.xz
            artifact: vcut-linux-x86_64
            binary_name: vcut
          # macOS is intentionally not built here — BtbN/FFmpeg-Builds does
          # not publish macOS assets. macOS users should `brew install ffmpeg`
          # and run vcut directly from source, or build their own ffmpeg.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Download bundled FFmpeg (${{ matrix.os }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/ffmpeg/bin

          ASSET="${{ matrix.asset }}"
          echo "Resolving latest release URL for: $ASSET"
          URL=$(curl -fsSL "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" \
                | python -c "import json,sys; rel=json.load(sys.stdin); print([a['browser_download_url'] for a in rel['assets'] if a['name']=='$ASSET'][0])")
          echo "Downloading $URL"
          curl -fsSL -o /tmp/ffmpeg-bundle "$URL"

          case "$ASSET" in
            *.zip)  unzip -q /tmp/ffmpeg-bundle -d /tmp/ffmpeg-unpacked ;;
            *.tar.xz) mkdir -p /tmp/ffmpeg-unpacked && tar -xJf /tmp/ffmpeg-bundle -C /tmp/ffmpeg-unpacked ;;
          esac

          BIN_DIR=$(find /tmp/ffmpeg-unpacked -type d -name bin | head -1)
          echo "FFmpeg bin dir: $BIN_DIR"
          cp "$BIN_DIR"/* vendor/ffmpeg/bin/
          chmod +x vendor/ffmpeg/bin/ffmpeg vendor/ffmpeg/bin/ffprobe 2>/dev/null || true
          ls -la vendor/ffmpeg/bin/

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable
        env:
          VCUT_FFMPEG_BIN: ${{ github.workspace }}/vendor/ffmpeg/bin
        run: python build.py

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Wrap the single-file vcut exe in a zip with sha256
          zip "${{ matrix.artifact }}.zip" "${{ matrix.binary_name }}"
          sha256sum "${{ matrix.artifact }}.zip" | awk '{print $1}' > "${{ matrix.artifact }}.zip.sha256"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}