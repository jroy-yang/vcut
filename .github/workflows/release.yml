name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needed to create GitHub Release

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vcut-linux-x86_64
            binary_name: vcut
          - os: macos-latest
            artifact: vcut-macos-universal2
            binary_name: vcut
          - os: windows-latest
            artifact: vcut-windows-x86_64
            binary_name: vcut.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Download bundled FFmpeg (${{ matrix.os }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/ffmpeg

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ASSET="ffmpeg-master-latest-win64-gpl-shared.zip"
            DEST="vendor/ffmpeg/bin"
            mkdir -p "$DEST"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ASSET="ffmpeg-master-latest-macos64-gpl-shared.zip"
            DEST="vendor/ffmpeg/bin"
            mkdir -p "$DEST"
          else
            # ubuntu-latest
            ASSET="ffmpeg-master-latest-linux64-gpl-shared.tar.xz"
            DEST="vendor/ffmpeg/bin"
            mkdir -p "$DEST"
          fi

          URL=$(curl -fsSL "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" \
                | python -c "import json,sys; rel=json.load(sys.stdin); print([a['browser_download_url'] for a in rel['assets'] if a['name']=='$ASSET'][0])")
          echo "Downloading $URL"
          curl -fsSL -o /tmp/ffmpeg-bundle "$URL"

          case "$ASSET" in
            *.zip)  unzip -q /tmp/ffmpeg-bundle -d /tmp/ffmpeg-unpacked ;;
            *.tar.xz) mkdir -p /tmp/ffmpeg-unpacked && tar -xJf /tmp/ffmpeg-bundle -C /tmp/ffmpeg-unpacked ;;
          esac

          # Find the bin/ dir inside the unpacked tree
          BIN_DIR=$(find /tmp/ffmpeg-unpacked -type d -name bin | head -1)
          cp "$BIN_DIR"/* "$DEST/"
          chmod +x "$DEST"/ffmpeg "$DEST"/ffprobe 2>/dev/null || true
          ls -la "$DEST"

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable
        run: python build.py

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Zip up the contents of dist/ for a clean per-OS archive
          7z a "${{ matrix.artifact }}.zip" ./* >/dev/null 2>&1 || \
            (which zip && zip -r "${{ matrix.artifact }}.zip" .) || \
            (echo "No archiver found, using tar"; tar -czf "${{ matrix.artifact }}.tar.gz" .)
          sha256sum "${{ matrix.artifact }}".* > SHA256SUMS.txt
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}